# See: https://taskfile.dev/api/
# Example (terminal): task generate

version: "3"

tasks:
  generate:
    aliases:
      - gen
    desc: "Generate code from proto files"
    cmds:
      - |
        protoc -I=protos protos/proto/sso/sso.proto \
          --go_out=./protos/gen/go \
          --go_opt=paths=source_relative,Mproto/sso/sso.proto=protos/gen/go/sso \
          --go-grpc_out=./protos/gen/go \
          --go-grpc_opt=paths=source_relative

  migrate:
    desc: "Run migrations"
    cmds:
      - go run ./cmd/migrator --postgres-dsn="postgres://sso_user:sso_pass@localhost:5432/sso_db?sslmode=disable" --migrations-path=./migrations
