services:
  pg:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: sso_user
      POSTGRES_PASSWORD: sso_pass
      POSTGRES_DB: sso_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sso_user -d sso_db" ]
      interval: 2s
      timeout: 2s
      retries: 30

  migrate:
    build: .
    depends_on:
      pg:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # overrides .env: inside the compose network the db is reachable at "pg", not localhost
      DB__HOST: pg
    entrypoint: ["/app/migrate.sh"]
    restart: "no"

  sso:
    build: .
    depends_on:
      pg:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "50051:50051"
    env_file:
      - .env
    environment:
      # overrides .env: inside the compose network the db is reachable at "pg", not localhost
      DB__HOST: pg
    restart: unless-stopped

volumes:
  pgdata: